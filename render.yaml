services:
  - type: web
    name: grandrp-hub
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Optional: a MongoDB Atlas free cluster keeps chat and photos across
      # restarts. Leave unset to use the JSON file on disk (ephemeral on the free plan).
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: grandrp_hub
