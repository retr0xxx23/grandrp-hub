name: Deploy static site to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -R "GrandRP HUB"/. _site/
          rm -rf _site/tools _site/server _site/node_modules
          rm -f _site/preview.bat _site/package.json _site/package-lock.json
          rm -f _site/Dockerfile _site/render.yaml _site/_headers _site/_redirects
          rm -f _site/README.md _site/.dockerignore _site/.gitignore
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
