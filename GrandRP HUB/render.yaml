services:
  - type: web
    name: grandrp-hub
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Optional: point at a MongoDB Atlas free cluster for persistent storage.
      # Leave unset to fall back to a JSON file on disk (ephemeral on Render free).
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: grandrp_hub
